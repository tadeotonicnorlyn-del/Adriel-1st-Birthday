<!DOCTYPE html>
 <html lang="en">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>🎈 Happy 1st Birthday Adie!</title>
     <style>
         * {
             margin: 0;
             padding: 0;
             box-sizing: border-box;
             font-family: Arial, sans-serif;
         }
         body {
             background: linear-gradient(135deg, #ffecd2, #fcb69f);
             min-height: 100vh;
             text-align: center;
             padding: 20px;
         }
         .container {
             max-width: 800px;
             margin: 0 auto;
             background: white;
             border-radius: 20px;
             padding: 30px;
             box-shadow: 0 5px 20px rgba(0,0,0,0.1);
         }
         h1 {
             color: #ff6f91;
             font-size: 2.5em;
             margin-bottom: 10px;
         }
         h2 {
             color: #444;
             margin-bottom: 20px;
         }
         .greeting {
             font-size: 1.2em;
             color: #555;
             margin: 25px 0;
             line-height: 1.8;
         }
         .photo-section, .video-section {
             margin: 30px 0;
         }
         h3 {
             color: #ff6f91;
             margin-bottom: 15px;
         }
         img {
             max-width: 100%;
             border-radius: 10px;
             box-shadow: 0 3px 10px rgba(0,0,0,0.1);
         }
         video {
             max-width: 100%;
             border-radius: 10px;
         }
         .heart {
             color: #ff6f91;
             font-size: 2em;
             margin: 20px 0;
         }
     </style>
 </head>
 <body>
     <div class="container">
         <h1>🎈 HAPPY 1ST BIRTHDAY! 🎈</h1>
         <h2>To Our Dearest Little One</h2>
         
         <div class="heart">💕🎂💕</div>
         
         <div class="greeting">
             <p>✨ Happy 1st Birthday! ✨</p>
             <p>One year ago, you came into our lives and made everything brighter.</p>
             <p>May your journey ahead be filled with love, laughter, and endless joy.</p>
             <p>You are our greatest blessing! 💖</p>
         </div>
         <div class="photo-section">
             <h3>📷 Precious Moments</h3>
             <img src="baby-photo.jpg" alt="Birthday Photo">
         </div>
         <div class="video-section">
             <h3>🎬 Special Video</h3>
             <video controls>
                 <source src="birthday-video.mp4" type="video/mp4">
                 Your browser does not support the video tag.
             </video>
         </div>
         
         <div class="heart">🎈🎉🎈</div>
     </div>
 </body>
 </html>
